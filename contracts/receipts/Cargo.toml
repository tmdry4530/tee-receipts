[package]
name = "tee-receipts-contract"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "NEAR contract that stores content-free receipts for NEAR AI Cloud TEE responses and re-checks their signatures on-chain"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.30", features = ["unstable"] }  # env::ecrecover is behind "unstable" in near-sdk
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing", "unstable"] }
serde_json = "1"
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
